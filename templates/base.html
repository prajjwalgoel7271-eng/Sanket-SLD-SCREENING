<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sanket — Early Signals. Brighter Futures.{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <img src="/static/favicon.svg" alt="Sanket Logo" class="brand-icon">
            <span>Sanket</span>
            <span class="nav-tagline">Early Signals. Brighter Futures.</span>
        </a>
        
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/test/sld" class="nav-link">Screening Hub</a>
            <a href="/about" class="nav-link">About</a>
            <a href="/disclaimer" class="nav-link">Disclaimer</a>
            
            <!-- Global Language Selector -->
            <select id="global-lang-select" class="lang-select-box">
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="bn">বাংলা (Bengali)</option>
                <option value="mr">मराठी (Marathi)</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="te">తెలుగు (Telugu)</option>
                <option value="gu">ગુજરાતી (Gujarati)</option>
                <option value="kn">ಕನ್ನಡ (Kannada)</option>
                <option value="ml">മലയാളം (Malayalam)</option>
                <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                <option value="or">ଓଡ଼ିଆ (Odia)</option>
                <option value="ur">اردو (Urdu)</option>
                <option value="bho">भोजपुरी (Bhojpuri)</option>
            </select>

            <!-- Dark / Light Theme Toggle -->
            <button id="theme-toggle-btn" class="theme-toggle-btn">
                ☀️ Light Mode
            </button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p><strong>Sanket</strong> — Precision Specific Learning Disorder Screening</p>
        <p style="margin-top: 0.3rem; opacity: 0.6;">Early Signals. Brighter Futures.</p>
    </footer>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/translate.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
